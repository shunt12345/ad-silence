<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AD Silencer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="panel" id="panel">
    <div class="titlebar">
      <div class="brand">
        <div class="logo"><span class="logo-triangle"></span></div>
        <span class="app-name">AD Silencer</span>
        <span class="status-pill" id="statusPill">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-text" id="statusText">ACTIVE</span>
        </span>
      </div>
      <div class="menu-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="state-block" id="stateBlock">
      <div class="sweep" id="sweep"></div>
      <div class="state-content">
        <div class="state-top">
          <span class="state-tag" id="stateTag">MONITORING AUDIO</span>
          <span class="vol-label" id="volLabel">100%</span>
        </div>
        <div class="state-title" id="stateTitle">Your show is playing</div>
        <div class="state-sub" id="stateSub">Watching for the next ad break — nothing to do.</div>
        <div class="equalizer" id="equalizer"></div>
      </div>
    </div>

    <div class="now-playing">
      <div class="thumb" id="thumb"><span id="thumbIcon">🎬</span></div>
      <div class="now-text">
        <div class="now-label" id="nowLabel">Now watching</div>
        <div class="now-title" id="nowTitle">Waiting for playback…</div>
        <div class="now-channel" id="nowChannel">—</div>
      </div>
    </div>

    <div class="volume-bar">
      <div class="volume-track">
        <div class="volume-fill" id="volumeFill"></div>
      </div>
    </div>

    <div class="duck-picker">
      <span class="duck-picker-label">Ad volume</span>
      <div class="duck-picker-options" id="duckPicker">
        <button class="duck-option" data-percent="5" type="button">5%</button>
        <button class="duck-option" data-percent="10" type="button">10%</button>
        <button class="duck-option" data-percent="15" type="button">15%</button>
      </div>
    </div>

    <div class="control">
      <button class="control-button" id="controlButton" type="button">
        <span id="btnIcon">🔊</span><span id="btnLabel">Mute now</span>
      </button>
      <div class="footnote" id="footnote">Running quietly in the background</div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
